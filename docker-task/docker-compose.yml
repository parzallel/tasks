version: "3.9"
services:
    
    nginx:
      image: nginx:latest
      container_name: task-nginx
      ports:
        - 8080:80
      volumes:
        - ./index.html:/usr/share/nginx/html/index.html

    redis:
      image: redis:latest 
      container_name: my-redis
      ports:
      - "6379:6379"